SilverStripe\Security\Group:
  beta:
    Title: Beta testers
  betaChild:
    Title: Beta child
    Parent: =>SilverStripe\Security\Group.beta
  other:
    Title: Other

SilverStripe\Security\Member:
  allowed:
    FirstName: Allowed
    Email: allowed@example.com
  denied:
    FirstName: Denied
    Email: denied@example.com
  betaMember:
    FirstName: Beta
    Email: beta@example.com
    Groups: =>SilverStripe\Security\Group.beta
  betaChildMember:
    FirstName: BetaChild
    Email: betachild@example.com
    Groups: =>SilverStripe\Security\Group.betaChild
  otherMember:
    FirstName: Other
    Email: other@example.com
    Groups: =>SilverStripe\Security\Group.other

SilverStripe\FeatureFlags\FeatureSelection:
  alwaysOn:
    Code: ALWAYS_ON
    EnableMode: On
  alwaysOff:
    Code: ALWAYS_OFF
    EnableMode: Off
  memberFeature:
    Code: MEMBER_FEATURE
    EnableMode: Partial

SilverStripe\FeatureFlags\FeatureSelectionItem:
  allowedMember:
    ContextKey: Member
    ContextID: =>SilverStripe\Security\Member.allowed
    FeatureSelection: =>SilverStripe\FeatureFlags\FeatureSelection.memberFeature
  betaGroup:
    ContextKey: Member
    ContextType: Group
    ContextID: =>SilverStripe\Security\Group.beta
    FeatureSelection: =>SilverStripe\FeatureFlags\FeatureSelection.memberFeature
